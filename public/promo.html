<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina — Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Tokens copiados de app/globals.css */
:root{
  --ink:#1e2a4a;--gray-600:#54607a;--gray-500:#6b7a99;--gray-400:#9aa8c2;--border:#e7ecf3;--bg:#eff5fc;--field:#f8fafd;
  --green:#58cc02;--green-dark:#46a300;--green-light:#d9f7b3;
  --blue:#2f6fee;--blue-dark:#1e56c9;--blue-light:#eaf1ff;--blue-lighter:#f5f9ff;
  --yellow:#f2a93b;--yellow-light:#fef2de;--yellow-text:#b4780c;
  --purple:#8b5cf6;--purple-light:#f1ebfe;--red:#ef4444;--red-light:#fde8e8;
  --pink:#f472b6;--pink-light:#feecf5;--teal:#14b8a6;--teal-light:#e1f7f3;
  --shadow-card:0 10px 30px rgba(30,42,74,.07),0 2px 6px rgba(30,42,74,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font:600 16px/1.5 Nunito,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.star-f{fill:var(--yellow);color:var(--yellow)}
.s16{font-size:16px}
.row{display:flex;align-items:center}

/* viewport + camera */
#viewport{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;will-change:transform}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
#fade{position:absolute;inset:0;background:var(--bg);opacity:1;z-index:5;pointer-events:none}

/* device frame */
.device{position:absolute;left:120px;top:40px;width:1360px;height:820px;background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 30px 60px rgba(30,42,74,.10),0 8px 24px rgba(30,42,74,.08);transform-origin:50% 50%}
.chrome{height:46px;display:flex;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid var(--border);position:relative}
.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px}
.url{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:520px;height:30px;border-radius:999px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:4px;font:700 13.5px Nunito;color:var(--gray-400)}
.url svg{margin-right:4px;color:var(--gray-500)}.url span{color:var(--ink)}.url em{font-style:normal}
.loadbar{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--blue)}
.app{position:absolute;top:46px;left:0;right:0;bottom:0;background:var(--bg);overflow:hidden}

/* sidebar (components/app-sidebar.tsx) */
.sidebar{position:absolute;left:0;top:0;bottom:0;width:264px;background:#fff;border-right:1px solid var(--border)}
.sb-head{padding:24px 16px}.sb-head img{height:36px;display:block}
.sb-nav{padding:8px 16px;display:flex;flex-direction:column;gap:4px}
.sb-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font:700 15px/1.25 Nunito;color:var(--gray-600);transition:background .15s,color .15s}
.sb-item svg{font-size:20px}
.sb-item.is-hover{background:var(--blue-lighter)}
.sb-item.active{background:var(--green-light);color:var(--green-dark)}

/* scenes */
.scene{position:absolute;left:264px;top:0;right:0;bottom:0;overflow:hidden;opacity:0;visibility:hidden}
.scene.full{left:0;background:var(--bg);z-index:2}
.scroll{position:relative;padding:32px 44px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:28px}
.tb-trig{position:relative;display:flex;align-items:center;gap:10px}
.tb-trig b{display:block;font:800 14px/1.25 Nunito}.tb-trig small{display:block;font:600 12px/1.25 Nunito;color:var(--gray-500)}
.tb-trig>svg{font-size:16px;color:var(--gray-400)}
.menu{left:auto;right:0;min-width:160px}
.menu .opt{justify-content:flex-start;gap:8px}.menu .opt svg{visibility:visible;font-size:16px}
.h1{font:900 34px/1.2 Nunito;letter-spacing:-.01em}
.sub{margin-top:6px;font:600 16px/1.5 Nunito;color:var(--gray-500)}
.h2{font:800 18px/1.4 Nunito;margin-bottom:16px}

/* shared components (components/ui/*) */
.card{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-card);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 14.5px/1.5 Nunito;border-radius:999px;padding:12px 24px;border:1px solid transparent;white-space:nowrap;transition:background-color .15s,transform .12s,opacity .2s}
.btn svg{font-size:16px}
.btn-primary{background:var(--green);color:#fff}.btn-primary.is-hover{background:var(--green-dark)}
.btn-outline{background:#fff;border-color:var(--border);color:var(--ink)}.btn-outline.is-hover{background:var(--blue-lighter)}
.btn-block{display:flex;width:100%;border-radius:14px;padding:12px 16px}
.btn-block.tall{padding:14px 16px}
.btn-sm{padding:10px 16px;font-size:13px;gap:6px}
.btn.disabled{opacity:.5}
.is-press{transform:scale(.95)!important}
.badge{display:inline-flex;align-items:center;background:var(--blue-light);color:var(--blue-dark);border-radius:999px;padding:4px 12px;font:700 12.5px/1.5 Nunito;white-space:nowrap}
.status{flex:none;border-radius:999px;padding:4px 12px;font:800 12px/1.5 Nunito;background:var(--green-light);color:var(--green-dark)}
.status.done{background:var(--border);color:var(--gray-600)}
.av{width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none}
.rating{display:flex;width:fit-content;align-items:center;gap:6px;font:700 13px/1.5 Nunito;color:var(--gray-500)}
.rating b{font-weight:800;color:var(--ink)}
.muted{font:700 13px/1.5 Nunito;color:var(--gray-500)}
.lbl{font:800 13.5px/1.4 Nunito}
.fcol{display:flex;flex-direction:column;gap:8px}
.field{position:relative;border:1.5px solid var(--border);border-radius:14px;background:var(--field);padding:14px 16px;font:700 14.5px/1.5 Nunito;color:var(--ink);min-height:53px;transition:border-color .15s,box-shadow .15s}
.field .ph{font-weight:600;color:var(--gray-400)}
.focus{border-color:var(--blue)!important;box-shadow:0 0 0 3px rgba(47,111,238,.2)}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.search{position:relative}
.search>svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--gray-400)}
.search .in{border:1.5px solid var(--border);border-radius:20px;background:#fff;padding:16px 20px 16px 52px;font:700 15px/1.5 Nunito;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.search .ph{font-weight:600;color:var(--gray-400)}
.trigger{position:relative;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:999px;background:#fff;padding:10px 16px;font:700 13.5px/1.5 Nunito;color:var(--gray-600);transition:border-color .15s}
.trigger>svg{color:var(--gray-400);font-size:16px}
.trigger.is-hover{border-color:var(--blue)}
.pop{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(30,42,74,.14);padding:4px;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;transition:opacity .15s,transform .2s;z-index:5}
.pop.open{opacity:1;transform:none}
.opt{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:7px 10px;border-radius:8px;font:600 14px/1.4 Nunito;color:var(--ink);white-space:nowrap}
.opt.is-hover{background:var(--blue-lighter)}
.opt svg{font-size:14px;visibility:hidden}.opt.sel svg{visibility:visible}
.fpill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:999px;background:#fff;padding:10px 16px;font:700 13.5px/1.4 Nunito;color:var(--gray-600);transition:background .15s,border-color .15s,color .15s}
.fpill.is-hover,.fpill.act{border-color:var(--blue);background:var(--blue-light);color:var(--blue-dark)}
.day-lbl{margin-bottom:10px;font:700 13px/1.4 Nunito;letter-spacing:.025em;text-transform:uppercase;color:var(--gray-500)}
.days{display:flex;flex-wrap:wrap;gap:32px}
.days .pills{display:flex;flex-wrap:wrap;gap:8px}
.datechip{width:48px;flex:none;display:flex;flex-direction:column;align-items:center;border-radius:14px;background:var(--blue-lighter);padding:6px 0}
.datechip b{font:900 16px/1 Nunito}.datechip small{font:700 10px/1.5 Nunito;letter-spacing:.025em;text-transform:uppercase;color:var(--gray-500)}
.datechip.lg{width:56px;padding:8px 0}.datechip.lg b{font-size:18px}.datechip.lg small{font-size:11px}

/* calendar (components/ui/calendar.tsx) */
.cal{padding:8px}
.cal-cap{position:relative;height:28px;display:flex;align-items:center;justify-content:space-between;font:500 14px Nunito;margin-bottom:16px}
.cal-cap svg{font-size:16px;width:28px;color:var(--ink)}
.cal-wd{display:flex}.cal-wd span{flex:1;text-align:center;font:400 12.8px/1.5 Nunito;color:var(--gray-500)}
.cal-wk{display:flex;margin-top:8px}
.cal-d{position:relative;display:grid;place-items:center;width:28px;height:28px;border-radius:14px;font:400 14px Nunito;color:var(--ink);transition:background .15s}
.cal.big .cal-d{flex:1;width:auto;height:auto;aspect-ratio:1}
.cal-d.out,.cal-d.dis{color:var(--gray-500);opacity:.5}
.cal-d.today{background:var(--blue-lighter)}
.cal-d.is-hover{background:var(--blue-lighter)}
.cal-d.sel{background:var(--green);color:#fff}
.cal-d.conf,.cal-d.comp{font-weight:800}
.cal-d.conf{background:var(--blue-light);color:var(--blue-dark)}
.cal-d.comp{background:var(--green-light);color:var(--green-dark)}
.cal-d.conf::after,.cal-d.comp::after{content:'';position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--blue)}
.cal-d.comp::after{background:var(--green)}

/* landing (app/page.tsx) + login (app/login/page.tsx) */
.mk-head{display:flex;align-items:center;justify-content:space-between;gap:24px;background:#fff;border-bottom:1px solid var(--border);padding:16px 48px}
.mk-head img{height:36px;display:block}
.mk-nav{display:flex;gap:4px}
.mk-nav span{border-radius:999px;padding:10px 16px;font:700 14.5px/1.5 Nunito;color:var(--gray-600)}
.mk-nav .on{background:var(--green-light);color:var(--green-dark)}
.hero{display:flex;align-items:center;gap:40px;padding:40px 48px 64px}
.hero h1{font:900 44px/1.15 Nunito;letter-spacing:-.02em}
.hero .lead{margin-top:16px;font:600 16px/1.5 Nunito;color:var(--gray-500)}
.hero .card{margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.sfield{display:flex;align-items:center;gap:12px;min-width:180px;border:1.5px solid var(--border);border-radius:999px;background:#fff;padding:14px 20px}
.sfield>svg{font-size:20px;color:var(--gray-400)}
.sfield .t{flex:1;display:flex;flex-direction:column;gap:2px;line-height:1}
.sfield .t small{font:700 11px/1 Nunito;letter-spacing:.025em;color:var(--gray-400)}
.sfield .t span{font:600 14px/1 Nunito;color:var(--gray-400)}
.sfield .chev{font-size:16px;color:var(--gray-400)}
.feats{margin-top:32px;display:flex;flex-wrap:wrap;gap:28px;list-style:none}
.feats li{width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font:700 13px/1.4 Nunito;color:var(--gray-500)}
.feats i{width:56px;height:56px;border-radius:14px;display:grid;place-items:center}
.feats i svg{font-size:24px}
.hero-art{position:relative;flex:none;width:300px;height:300px;display:flex;align-items:center;justify-content:center}
.hero-art .c{position:absolute;border-radius:50%}
.hero-art img{position:relative;z-index:1;width:100%;transform-origin:50% 100%}
.dest{padding:0 48px 64px}
.dest-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
.dest-head h2{font:800 22px/1.4 Nunito}.dest-head p{margin-top:4px;font:600 14.5px/1.5 Nunito;color:var(--gray-500)}
.dest-head a{font:700 13px Nunito;color:var(--blue-dark)}
.dest-cards{display:flex;gap:20px}
.dest-cards .card{flex:1;display:flex;flex-direction:column;gap:16px}
.login{width:480px;margin:0 auto;padding:96px 0;display:flex;flex-direction:column;align-items:center}
.or{display:flex;align-items:center;gap:10px;font:700 13px Nunito;color:var(--gray-500)}
.or i{height:1px;flex:1;background:var(--border)}

/* tutores (app/(app)/tutores/page.tsx) */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tcard{display:flex;gap:16px}
.tcard .body{flex:1;min-width:0;display:flex;flex-direction:column}
.tcard h3{font:800 18px/1.4 Nunito;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .bio{margin-bottom:10px;font:600 13.5px/1.625 Nunito;color:var(--gray-500);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tcard .fr{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.tcard .fr span{border:1.5px solid var(--border);border-radius:999px;padding:6px 12px;font:700 12px/1.3 Nunito;color:var(--gray-600)}

/* agenda (app/(app)/mis-sesiones/page.tsx) */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.stat{border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px}
.stat p{font:700 13px/1.5 Nunito;color:var(--gray-500)}.stat b{display:block;margin-top:4px;font:800 15px/1.5 Nunito}
.cols{display:flex;gap:20px;align-items:flex-start}
.cols>div{display:flex;flex-direction:column;gap:20px}
.h3{font:800 18px/1.4 Nunito;margin-bottom:14px}
.legend{margin-top:12px;display:flex;gap:16px;border-top:1px solid var(--border);padding-top:16px}
.legend span{display:flex;align-items:center;gap:6px;font:700 12.5px/1.5 Nunito;color:var(--gray-500)}
.legend i{width:8px;height:8px;border-radius:50%}
.srow{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:12px 0}
.srow:last-child{border-bottom:0;padding-bottom:0}
.srow .who{flex:1;min-width:0}
.srow .who b{display:block;font:800 14px/1.4 Nunito}.srow .who small{font:700 12.5px/1.5 Nunito;color:var(--gray-500)}
.rec b{display:block;font:800 13.5px/1.5 Nunito}.rec p{font:600 13px/1.5 Nunito;color:var(--gray-500)}
.tsrow{display:flex;align-items:center;gap:16px}
.tsrow .who{flex:1}.tsrow .who b{display:block;font:800 16px/1.4 Nunito}.tsrow .who small{font:700 13px/1.5 Nunito;color:var(--gray-500)}

/* calificar (components/calificar-form.tsx) */
.stars{display:flex;justify-content:center;gap:8px;margin-bottom:24px}
.star{padding:2px;font-size:32px;color:var(--border);transition:color .15s}
.star.on{color:var(--yellow)}.star.on svg{fill:var(--yellow)}

/* mis franjas (components/franja-form.tsx) */
.fform{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.fgroup{position:relative;display:flex;flex-direction:column;gap:8px}
.fgroup>label{font:800 13px/1.4 Nunito}
.ftrig{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:14px;background:var(--field);padding:14px 16px;font:700 14.5px/1.5 Nunito;transition:border-color .15s}
.ftrig.is-hover{border-color:var(--blue)}
.ftrig>svg{font-size:16px;color:var(--gray-400)}
.ftrig .v{flex:1}.ftrig .v.ph{font-weight:600;color:var(--gray-400)}
.fpill .res{color:var(--blue)}
.pop-in{animation:popin .5s cubic-bezier(.3,1.6,.5,1)}

/* materias (components/materias-grid.tsx) */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mcard{display:flex;flex-direction:column}
.mcard i{width:56px;height:56px;margin-bottom:14px;border-radius:14px;display:grid;place-items:center}
.mcard i svg{font-size:24px}
.mcard h3{font:800 18px/1.4 Nunito}.mcard p{margin:6px 0 16px;font:700 13.5px/1.5 Nunito;color:var(--gray-500)}

/* chapter cards (full-screen green) */
.chapter{position:absolute;inset:0;z-index:6;background:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0;visibility:hidden;overflow:hidden}
.ch-dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.ch-logo{position:relative;background:#fff;border-radius:999px;padding:10px 26px;box-shadow:0 12px 30px rgba(30,42,74,.14)}
.ch-logo img{height:40px;display:block}
.ch-m{position:relative;width:210px;height:210px;margin:40px 0 30px;border-radius:50%;background:#fff;box-shadow:0 18px 40px rgba(30,42,74,.16)}
.ch-m img{position:absolute;left:50%;bottom:14px;height:232px;margin-left:-110px;transform-origin:50% 100%}
.ch-chip{position:relative;font:800 15px/1 Nunito;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.ch-t{position:relative;margin-top:14px;font:900 104px/1.02 Nunito;letter-spacing:-.03em}
.ch-t span{display:inline-block;margin:0 .12em}
.ch-s{position:relative;margin-top:20px;font:700 26px/1.3 Nunito;color:rgba(255,255,255,.93)}

/* mascot + host */
.bob{animation:bob 2s ease-in-out infinite}
.shadow{display:block;height:16px;border-radius:50%;background:rgba(30,42,74,.12);margin-top:4px;animation:shadow 2s ease-in-out infinite}
#host{position:absolute;left:30px;bottom:24px;display:flex;align-items:flex-end;gap:14px;z-index:4;transform-origin:40px 100%}
.host-ring{position:relative;width:76px;height:76px;border-radius:50%;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-card)}
#host-img{position:absolute;left:50%;bottom:6px;height:84px;transform-origin:50% 100%}
#host .shadow{width:48px;margin:6px auto 0}
#host-say{padding:12px 18px;font:800 15px/1.35 Nunito;max-width:370px;margin-bottom:26px;border-radius:16px 16px 16px 4px}

/* cierre */
#closing{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;visibility:hidden;text-align:center}
#closing .m{display:flex;flex-direction:column;align-items:center}
#closing .m img{height:250px;transform-origin:50% 100%}#closing .shadow{width:130px}
.c-logo{height:74px;margin-top:10px;mix-blend-mode:multiply} /* el PNG del logo trae fondo blanco */
#closing h1{font:900 46px/1.15 Nunito;letter-spacing:-.02em}#closing p{font:600 19px Nunito;color:var(--gray-500)}
#c-cta{margin-top:10px;padding:14px 32px;font-size:16px}

#dev{position:fixed;left:12px;top:12px;z-index:20;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 12px;font:700 13px Nunito;box-shadow:var(--shadow-card)}
#dev input{width:320px}
#dev[hidden]{display:none}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.8);opacity:.55}}
@keyframes blink{50%{opacity:0}}
@keyframes popin{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
</style>
</head>
<body>

<template id="tpl-device">
  <div class="device">
    <div class="chrome">
      <span class="dots"><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i></span>
      <div class="url"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>lumina.app</span><em id="url-path">/</em></div>
      <i class="loadbar" id="loadbar"></i>
    </div>
    <div class="app" id="app">
      <aside class="sidebar">
        <div class="sb-head"><img src="logo-lumina.png" alt="Lumina"></div>
        <nav class="sb-nav" id="nav-estudiante"></nav>
        <nav class="sb-nav" id="nav-tutor"></nav>
      </aside>
    </div>
  </div>
</template>

<div id="viewport">
  <div id="stage"><div id="closing"></div></div>
  <div id="host">

    s.el.style.opacity = a;
    s.el.style.visibility = s === sc || s === prev ? 'visible' : 'hidden';
    if (!s.chapter) s.el.style.transform = s === sc && a < 1 ? `translateY(${(1 - a) * 22}px)` : '';
  });
  // the closing scene fades the whole device out, so it must not re-run over the next loop's intro
  if (!prev.closing) prev.update(prev.dur);
  sc.update(lt);
  if (sc.url && urlPath.textContent !== sc.url) urlPath.textContent = sc.url;
  if (sc.role) { navEst.style.display = sc.role === 'tutor' ? 'none' : ''; navTut.style.display = sc.role === 'tutor' ? '' : 'none'; }
  if (!sc.chapter) navs.forEach(n => n.classList.toggle('active', n.dataset.nav === sc.nav));
  loadbar.style.width = eout(prog(lt, 0, 750)) * 100 + '%';
  loadbar.style.opacity = 1 - prog(lt, 750, 300);

  // camera
  const cam = camAt(T);
  stage.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
  applied = cam;

  // cursor, hover, press
  const cur = curAt(T);
  const tgt = cur.arrived && cur.el && cur.el.nodeType ? cur.el : null;
  if (tgt !== hovered) { hovered && setHover(hovered, false); tgt && setHover(tgt, true); hovered = tgt; }
  const c = CLK.find(c => T >= c.T && T < c.T + 120), pe = c ? c.el : null;
  if (pe !== pressed) { pressed && pressed.classList.remove('is-press'); pe && pe.classList.add('is-press'); pressed = pe; }
  const press = c ? 1 - .1 * Math.sin(Math.PI * clamp((T - c.T) / 100)) : 1;

  // chapter card: circle wipe out of the last click, then lifts like a curtain
  if (sc.chapter) {
    const r = DIAG * eio(prog(lt, 0, 900)), ox = cam.x + cam.s * cur.x, oy = cam.y + cam.s * cur.y;
    sc.el.style.clipPath = `circle(${r}px at ${ox}px ${oy}px)`;
    sc.el.style.transform = '';
    host.style.opacity = 1 - prog(lt, 0, 300);
    curAlpha = 1 - prog(lt, 150, 300);
  } else if (prev.chapter) {
    const u = eio(prog(lt, 0, 950));
    prev.el.style.clipPath = 'none';
    prev.el.style.transform = `translateY(${-u * 100}%)`;
    if (u >= 1) prev.el.style.visibility = 'hidden';
    const hu = prog(lt, 800, 600);
    host.style.opacity = clamp(hu * 4);
    host.style.transform = `translateY(${(1 - eout(hu)) * 40}px) scale(${popScale(hu)})`;
    curAlpha = prog(lt, 900, 300);
  }

  // mascot host: swap pose, squash & stretch on change, caption slide-in
  let pi = findLast(POSE, T); const pw = pi < 0; if (pw) pi = POSE.length - 1;
  const P = POSE[pi], pdt = pw ? 1e9 : T - P.T;
  if (hostImg.dataset.p !== P.p) { hostImg.src = `lumina-${P.p}.png`; hostImg.dataset.p = P.p; }
  if (say.textContent !== P.say) say.textContent = P.say;
  let sx = 1, sy = 1;
  if (P.pc && pdt < 160) {
    if (pdt < 60) { const u = pdt / 60; sx = 1 + .14 * u; sy = 1 - .14 * u; }
    else if (pdt < 120) { const u = (pdt - 60) / 60; sx = lerp(1.14, .94, u); sy = lerp(.86, 1.08, u); }
    else { const u = (pdt - 120) / 40; sx = lerp(.94, 1, u); sy = lerp(1.08, 1, u); }
  }
  hostImg.style.transform = `translateX(-50%) scale(${sx},${sy})`;
  const cu = P.sc ? eout(prog(pdt, 0, 380)) : 1;
  say.style.opacity = cu; say.style.transform = `translateX(${(1 - cu) * -10}px)`;

  draw(T, now, cam, cur, press);

  if (!dev.hidden) {
    if (document.activeElement !== devRange) devRange.value = T;
    devT.textContent = `${(T / 1000).toFixed(1)}s / ${(TOTAL / 1000).toFixed(1)}s · ${sc.id}${paused ? ' · pausa' : ''}`;
  }
  requestAnimationFrame(frame);
}

// dev scrubber: open with #dev — space toggles pause
if (location.hash === '#dev') {
  dev.hidden = false; devRange.max = TOTAL;
  devRange.addEventListener('input', () => { const v = +devRange.value; if (paused) pT = v; else t0 = performance.now() - v; });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault();
    const now = performance.now();
    if (paused) t0 = now - pT; else pT = ((now - t0) % TOTAL + TOTAL) % TOTAL;
    paused = !paused;
  });
}

Promise.all([document.fonts ? document.fonts.ready : 0, new Promise(r => addEventListener('load', r))])
  .then(() => { t0 = performance.now(); requestAnimationFrame(frame); });
</script>
</body>
</html>
